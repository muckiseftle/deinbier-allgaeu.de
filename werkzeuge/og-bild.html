<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>OG-Bild DEIN BIER</title>
    <style>
      /* =====================================================================
         Vorlage fuer das Social-Preview-Bild, 1200 x 630.
         Wird ueber werkzeuge/og-bild.mjs zu public/og-bild.jpg abfotografiert.

         Bewusst kein erzeugtes Bild: echtes Foto der Brauerei, echtes Logo,
         Markenschriften und Markenfarben. Kritischer Inhalt liegt in den
         mittleren 80 Prozent, damit beim Zuschnitt durch die Netzwerke
         nichts Wichtiges wegfaellt.
         ===================================================================== */

      @font-face {
        font-family: 'Vollkorn Variable';
        font-style: normal;
        font-weight: 400 900;
        src: url('../public/schriften/vollkorn-latin.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Vollkorn Variable';
        font-style: italic;
        font-weight: 400 900;
        src: url('../public/schriften/vollkorn-latin-italic.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Work Sans Variable';
        font-style: normal;
        font-weight: 100 900;
        src: url('../public/schriften/work-sans-latin.woff2') format('woff2-variations');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fbf7ec;
        font-family: 'Work Sans Variable', sans-serif;
        color: #3d2911;
      }

      .karte {
        position: relative;
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 7fr 5fr;
      }

      /* Linke Haelfte: Text auf Creme */
      .text {
        padding: 72px 56px 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 2;
      }

      .marke {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }

      .marke img {
        width: 84px;
        height: 84px;
      }

      .marke-name {
        font-family: 'Vollkorn Variable', serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.01em;
        color: #523816;
        line-height: 1;
      }

      .marke-signatur {
        font-family: 'Vollkorn Variable', serif;
        font-style: italic;
        font-size: 21px;
        color: #8a4726;
        line-height: 1.2;
        padding-bottom: 0.08em;
        margin-top: 4px;
      }

      h1 {
        font-family: 'Vollkorn Variable', serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: #523816;
      }

      .vorspann {
        font-family: 'Vollkorn Variable', serif;
        font-size: 26px;
        line-height: 1.35;
        color: #3d2911;
        margin-top: 26px;
        max-width: 22ch;
      }

      .ort {
        margin-top: 38px;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7c6844;
      }

      /* Rechte Haelfte: echtes Foto */
      .bild {
        position: relative;
        overflow: hidden;
      }

      .bild img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Weicher Uebergang von der Cremeflaeche ins Foto, damit die Kante
         nicht wie eine Collage wirkt. */
      .bild::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, #fbf7ec 0%, rgba(251, 247, 236, 0) 34%);
      }

      /* Warmes Bernsteinlicht wie im Hero der Seite */
      .licht {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 70% 60% at 22% 0%,
          rgba(232, 184, 113, 0.34) 0%,
          rgba(232, 184, 113, 0) 68%
        );
        z-index: 1;
        pointer-events: none;
      }

      /* Wegstrecke als unterer Abschluss, wie auf der Seite */
      .weg {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 40px;
        height: 1px;
        background: #d6c9a8;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div class="karte">
      <div class="licht"></div>

      <div class="text">
        <div class="marke">
          <img src="../public/logo.png" alt="" />
          <div>
            <p class="marke-name">DEIN BIER</p>
            <p class="marke-signatur">zu Hause(n) gebraut</p>
          </div>
        </div>

        <h1>Die Brauerei<br />kommt zu Euch.</h1>
        <p class="vorspann">
          Handwerklich gebrautes Bier aus Hausen im Ostallgäu.
        </p>
        <p class="ort">Brauseminare · Verleih · Ferienwohnung</p>
      </div>

      <div class="bild">
        <!-- Menschen beim Brauen: wirkt beim Teilen einladender als eine
             reine Anlagenaufnahme. -->
        <img src="../src/bilder/brauseminar-runde.jpg" alt="" />
      </div>

      <div class="weg"></div>
    </div>
  </body>
</html>
